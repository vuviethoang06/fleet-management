server_tokens off;
resolver 127.0.0.11 valid=10s;   # DNS nội bộ Docker, cho phép nginx khởi động độc lập với các service phía sau
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;

# HTTP -> HTTPS
server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# Endpoint nội bộ cho nginx-prometheus-exporter (không publish ra host)
server {
    listen 8081;
    location /stub_status { stub_status; allow all; }
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 1m;
    limit_req zone=perip burst=40 nodelay;

    # Ứng dụng Fleet (CSP chặt vì app không dùng script ngoài)
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'self'" always;
        set $app http://app:8000;
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # /metrics của app chỉ cho Prometheus (nội bộ) - chặn từ ngoài
    location = /metrics { return 404; }

    location /grafana/ {
        include /etc/nginx/security-headers.conf;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /grafana/api/live/ {
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /pgadmin/ {
        include /etc/nginx/security-headers.conf;
        set $pgadmin http://pgadmin:80;
        rewrite ^/pgadmin/(.*)$ /$1 break;
        proxy_pass $pgadmin;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
