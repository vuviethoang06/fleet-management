{% extends "base.html" %}{% block body %}<h2>Lịch bảo dưỡng</h2>
<form class="add" method="post"><select name="vehicle_id" required>{% for v in vehicles %}<option value="{{ v.id }}">{{ v.plate }}</option>{% endfor %}</select>
<input name="description" placeholder="Nội dung bảo dưỡng" required><input name="due_date" type="date" required><button>Lên lịch</button></form>
<table><tr><th>Xe</th><th>Nội dung</th><th>Hạn</th><th>Hoàn thành</th><th></th></tr>
{% for r in rows %}<tr><td>{{ r.plate }}</td><td>{{ r.description }}</td><td>{{ r.due_date }}</td><td>{{ 'Có' if r.done else 'Chưa' }}</td>
<td>{% if not r.done %}<form method="post" action="/maintenance/{{ r.id }}/done"><button>Đánh dấu xong</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
