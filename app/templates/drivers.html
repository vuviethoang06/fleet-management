{% extends "base.html" %}{% block body %}<h2>Quản lý tài xế</h2>
<form class="add" method="post"><input name="name" placeholder="Họ tên" required><input name="license_no" placeholder="Số GPLX" required><input name="phone" placeholder="SĐT"><button>Thêm tài xế</button></form>
<table><tr><th>ID</th><th>Họ tên</th><th>GPLX</th><th>SĐT</th><th></th></tr>
{% for r in rows %}<tr><td>{{ r.id }}</td><td>{{ r.name }}</td><td>{{ r.license_no }}</td><td>{{ r.phone }}</td>
<td><form method="post" action="/drivers/{{ r.id }}/delete"><button>Xóa</button></form></td></tr>{% endfor %}</table>{% endblock %}
