# Đề 30 - Fleet Management System | Triển khai bằng Docker Compose
name: fleet
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  # ---------- COMMIT 1: Ứng dụng + Database + Nginx ----------
  db:
    <<: *hardening
    image: postgres:16-alpine
    cap_add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    <<: *hardening
    build: ./app
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB}
      DB_USER: fleet_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    networks: [frontend, backend, monitoring]

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    cap_drop: ["ALL"]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE, AUDIT_WRITE]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./postgres/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db: {condition: service_healthy}
    networks: [frontend, backend]

  nginx:
    <<: *hardening
    build: ./nginx
    ports:
      - "80:8080"
      - "443:8443"
    read_only: true
    tmpfs: [/tmp]
    depends_on: [app]
    networks: [frontend, monitoring]

  # ---------- COMMIT 2: Prometheus + Grafana ----------
  cadvisor:
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    cap_drop: []          # cAdvisor cần đọc cgroup của host
    privileged: false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]

  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.3
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [monitoring]

  postgres-exporter:
    <<: *hardening
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://fleet_monitor:${DB_APP_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db: {condition: service_healthy}
    networks: [backend, monitoring]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.53.0
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    networks: [monitoring]

  grafana:
    <<: *hardening
    image: grafana/grafana:11.1.0
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [frontend, monitoring]

  # ---------- COMMIT 3: Loki + Promtail (log tập trung) ----------
  loki:
    <<: *hardening
    image: grafana/loki:3.1.0
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    networks: [monitoring]

  promtail:
    <<: *hardening
    image: grafana/promtail:3.1.0
    cap_drop: []          # cần đọc docker.sock và log container của host (xem mục Hardening trong báo cáo)
    user: root
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on: [loki]
    networks: [monitoring]

networks:
  frontend:
  backend:
    internal: true      # DB không ra được Internet và không truy cập được từ ngoài
  monitoring:
    internal: true

volumes:
  pgdata:
  pgadmindata:
  promdata:
  grafanadata:
  lokidata:
